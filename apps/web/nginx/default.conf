# Serves the front's build and forwards /api/ to the API on the same origin: no CORS, and
# response headers such as Retry-After stay readable by the front (src/config.ts).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # text/html is always compressed. API responses are passed on as the API sends them.
    gzip_types text/css application/javascript image/svg+xml;

    # Docker's embedded DNS. With the address in a variable, nginx resolves "api" per request
    # (cached for 10 s) instead of once at startup: it starts without the API (502 on /api/
    # until the API is up) and follows the API to a new IP when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    location /api/ {
        # With a variable in proxy_pass, nginx sends the URI unchanged: the prefix goes here.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwritten, never appended. The API (TRUST_PROXY=true) takes the first address of
        # X-Forwarded-For as the client's IP for the rate limit; appending
        # ($proxy_add_x_forwarded_for) would keep whatever the client put there.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's output: content-hashed file names, so a URL never changes content. A missing file
    # is a 404, never index.html (which a <script> would reject as the wrong MIME type).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        # Without "always": success responses only. A 404 must not be cached for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Container healthcheck: nginx is up and the build is in place. Not in the access log.
    location = /healthz {
        access_log off;
        try_files /index.html =404;
    }

    # The app has no favicon, but browsers ask for one: a 404, not index.html.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Front routes (/, /simulacoes/:id): any other path gets index.html and the router decides.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        # Always revalidated: after a deploy the browser loads the new bundle (and its
        # CONSENT_VERSION), never a cached index.html pointing to the old one.
        add_header Cache-Control "no-cache" always;
    }
}
