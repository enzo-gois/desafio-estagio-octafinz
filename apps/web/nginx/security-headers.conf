# Security headers for the front's own responses. Included in each location instead of set once
# in the server block: nginx drops inherited add_header directives as soon as a location defines
# its own (Cache-Control). /api/ does not get them: the API sends its own (helmet).
add_header X-Content-Type-Options "nosniff" always;
# The result URL carries the simulation's UUID, its only access key: never send it elsewhere.
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
